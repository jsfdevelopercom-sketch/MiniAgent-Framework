plugins {
    id 'java-library'
}

group = 'com.silicondoctor'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    api 'com.fasterxml.jackson.core:jackson-databind:2.15.2'
    api 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.15.2'
}

tasks.register('runTester', JavaExec) {
    mainClass = 'com.miniagent.api.ModelTester'
    classpath = sourceSets.main.runtimeClasspath
}
tasks.register('runOpenAiHardcodedTest', JavaExec) {
    group = 'verification'
    description = 'Runs direct OpenAiHttpClient hardcoded test.'
    mainClass = 'com.miniagent.api.OpenAiDirectHardcodedTest'
    classpath = sourceSets.main.runtimeClasspath
}